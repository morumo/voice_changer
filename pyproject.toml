[project]
name = "voice-changer"
version = "0.1.0"
description = "Real-time voice changer with DSP effects"
requires-python = ">=3.11"
dependencies = [
  "sounddevice>=0.5.1",
  "numpy>=2.0",
  "scipy>=1.13",
  "pyrubberband>=0.3.3",
  "pyworld>=0.3.4",
  "rich>=13.7",
  "pyyaml>=6.0",
  "setuptools==69.5.1",
]

[project.scripts]
voice-changer = "voice_changer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_changer"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
